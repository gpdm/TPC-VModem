[Unit]
After=vmodem-network.service
PartOf=vmodem-network.service
ConditionPathExists=/sys/class/net/visp0
ConditionPathExists=/opt/vmodem/etc/3proxy/3proxy.cfg

[Service]
Environment=CONFIGFILE=/opt/vmodem/etc/3proxy/3proxy.cfg

User=proxy
Group=proxy

AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE

LogNamespace=vmodem
