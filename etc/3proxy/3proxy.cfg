nserver 9.9.9.9
nscache 4096

maxconn 32
log

nsrecord www.visp.test 100.64.255.180

# Synthetic DNS
auth iponly
allow * 100.64.254.0/24
dnspr -i100.64.255.53 -p53 -F100.64.255.80

flush

# HTTP forwarding
auth iponly
allow * 100.64.254.0/24 * 80 HTTP
parent 1000 http wayback.protoweb.org 7851
proxy -i100.64.255.80 -p80

flush

# VISP web server
auth iponly
allow * 100.64.254.0/24
http file * / /opt/vmodem/www/index.html
http file * /*.html "/opt/vmodem/www/$1.html"
http file * /images/** "/opt/vmodem/www/images/$1"
httpsrv -i100.64.255.180 -p80

flush
