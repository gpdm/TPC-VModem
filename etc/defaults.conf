# TPC-VModem global defaults, loaded before per-port configuration.
# Per-port configuration in /opt/vmodem/portconfig overrides these values
# on a per-adapter / per-port basis.

# Echo serial data back to the client terminal: 1 = enabled, 0 = disabled.
echoser=1

# Hayes result codes: 1 = verbose text (for example, CONNECT), 0 = numeric.
resultverbose=1

# Terminal type used when a serial terminal connects to the modem.
TERM="vt100"

# Serial communication speed between the retro computer and the Raspberry Pi.
baud=57600

# Default modem profile to emulate.
modem_profile=V34BIS

# Enable proxy ARP for PPP clients: 1 = enabled, 0 = disabled.
option_proxyarp=0

# Use modem control signals (including DCD) with pppd: 1 = enabled, 0 = local mode.
option_modem_control=1

# Enable additional pppd debugging output: 1 = enabled, 0 = disabled.
option_debug=0

# Print PPP traffic-shaping statistics: 1 = enabled, 0 = disabled.
option_tcstatus=1

# Seconds between traffic statistics reports.
tc_status_interval=60

# Seconds between PPP LCP echo requests; 0 disables them.
lcp_echo_interval=10

# Unanswered LCP echo requests before the PPP connection is considered lost.
lcp_echo_failure=3

# Primary DNS server offered to the connected computer.
dns_primary=9.9.9.9

# Secondary DNS server offered to the connected computer.
dns_secondary=149.112.112.112

# Unix socket used to communicate with the shared audio daemon.
audio_socket="/run/vmodem/sound.sock"

# Default Hayes speaker mode: ISDN profiles always use ATM0; analog profiles use ATM1.
speaker_mode_default=1

# Duration in seconds to play dial tone after dialing begins.
dialtone_time=2

# PPP line-noise duration in seconds when ATM1 is selected.
linenoise_time=4

# Number of ringback tones played during dialing.
ringback_cycles=2

# Pause in seconds between ringback tones.
ringback_pause=3
